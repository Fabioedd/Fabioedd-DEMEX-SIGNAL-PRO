name: DEMEX tests
on:
  pull_request:
  push:
    branches:
      - main
      - demex-backtest-84-refresh
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile runtime modules
        run: python -m py_compile main.py bullex_connector.py signal_engine.py trade_manager.py backtest_filter.py strategies/my_strategy.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
