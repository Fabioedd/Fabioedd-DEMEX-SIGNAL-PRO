name: DEMEX tests
on:
  pull_request:
  push:
    branches:
      - main
      - demex-backtest-84-refresh
      - feature/otc-availability-refresh-5m
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
