name: DEMEX tests
on:
  pull_request:
  push:
    branches:
      - main
      - demex-backtest-84-refresh
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Termux updater shell syntax
        run: bash -n demex-auto-update.sh
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
